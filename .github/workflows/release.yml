name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Install dependencies
        run: mise run github:workflows:ci:install

      - name: Package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: mise run github:workflows:release:package

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
