name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to package and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package and publish, for example v0.2.1
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Verify the tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: mise run github:workflows:release:verify-tag

      - name: Install dependencies
        run: mise run github:workflows:ci:install

      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: mise run github:workflows:release:package

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: gh release upload "$TAG_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber

  chrome-web-store:
    name: Chrome Web Store
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Download the Chrome package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'emote-importer-chrome-*.zip' --dir dist

      - name: Google Cloud auth
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Publish
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: mise run github:workflows:release:chrome-web-store dist/emote-importer-chrome-*.zip
